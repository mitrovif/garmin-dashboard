name: Daily Garmin sync
on:
  schedule:
    - cron: "0 4 * * *"   # every day at 04:00 UTC
  workflow_dispatch:       # "Run workflow" button for a manual sync
permissions:
  contents: write          # lets the job commit the data files
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install garminconnect pandas numpy
      - run: python export_data.py
        env:
          GARMIN_TOKEN: ${{ secrets.GARMIN_TOKEN }}
      - name: Commit updated data
        run: |
          git config user.name "garmin-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Garmin data sync $(date -u +%Y-%m-%d)"
          git push
